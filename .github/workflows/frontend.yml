name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Hard rule: viewer API key must only be referenced from
      # frontend/src/lib/server-api.ts. Anywhere else = client leak.
      - name: Viewer key server-only check
        run: |
          set -e
          matches=$(grep -RInE "APP_API_KEY_VIEWER(_SERVER)?" src 2>/dev/null \
            | grep -v "^src/lib/server-api\.ts:" || true)
          if [ -n "$matches" ]; then
            echo "::error::Viewer API key referenced outside src/lib/server-api.ts"
            echo "$matches"
            exit 1
          fi

      - name: ESLint
        run: npx eslint --max-warnings=0 .

      - name: Type check
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run --reporter=dot

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright (mocked API)
        run: npx playwright test

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Next build
        env:
          BACKEND_API_URL: http://localhost:8000
          APP_API_KEY_VIEWER_SERVER: ci-viewer-key-must-be-long-enough
        run: npm run build
