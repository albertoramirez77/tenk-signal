[project]
name = "tenk-signal"
version = "0.1.0"
description = "Alpha-from-text pipeline: SEC filings → LLM extraction → backtest"
requires-python = ">=3.12"
readme = "../README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",      # sync driver for alembic
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "anthropic>=0.40.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.10.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "respx>=0.21.0",                # httpx mock
    "freezegun>=1.5.0",
    "types-beautifulsoup4>=4.12.0",
    "httpx2>=0.1.0",                # required by starlette>=1.2 TestClient
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tenk_signal"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes / pycodestyle
    "I",                  # import sort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "T20",                # no print
    "RUF",
]
ignore = [
    "E501",               # line length handled by formatter
    "B008",               # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]      # allow print() in tests for debugging
"scripts/**" = ["T20"]    # CLI scripts legitimately write to stdout

# ---------------------------------------------------------------------------
# mypy: strict on the package, lenient on tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "prometheus_fastapi_instrumentator.*", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:yfinance.*",
]
markers = [
    "integration: requires Postgres",
    "e2e: end-to-end pipeline on fixtures",
]
